<!-- Pagefind Search -->
<div class="site-searchbox">
    <label id="site-search-label" class="search-label" for="site-search-input">Search documentation</label>
    <div id="pagefind-search"></div>
</div>

<!-- Load Pagefind UI -->
<link href="/pagefind/pagefind-ui.css" rel="stylesheet">
<script src="/pagefind/pagefind-ui.js"></script>
<script>
    window.addEventListener('DOMContentLoaded', (event) => {
        new PagefindUI({
            element: "#pagefind-search",
            showSubResults: true,
            showImages: false,
            excerptLength: 15,
            processResult: function(result) {
                return result;
            }
        });
        const input = document.querySelector('#pagefind-search input');
        if (input) {
            input.id = 'site-search-input';
            input.setAttribute('aria-labelledby', 'site-search-label');
        }
    });
</script>
